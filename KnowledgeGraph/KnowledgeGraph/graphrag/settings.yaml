### GraphRAG 3.0.9 配置文件 - 智谱 AI
### 文档：https://microsoft.github.io/graphrag/config/yaml/

### LLM 设置 ###

completion_models:
  default_completion_model:
    model_provider: openai
    model: glm-4-flash
    auth_method: api_key
    api_key: ${ZHIPU_API_KEY}
    api_base: https://open.bigmodel.cn/api/paas/v4/
    model_supports_json: false
    retry:
      type: exponential_backoff
      max_retries: 5
      backoff_factor: 2.0
    max_input_tokens: 12000
    concurrent_requests: 1
    request_delay: 1.0

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: embedding-3
    auth_method: api_key
    api_key: ${ZHIPU_API_KEY}
    api_base: https://open.bigmodel.cn/api/paas/v4/
    retry:
      type: exponential_backoff
    max_retries: 3
    concurrent_requests: 1

### 文档处理设置 ###

input:
  type: text
  file_pattern: '.*\.(md|txt)$$'

chunking:
  type: tokens
  size: 600
  overlap: 100
  encoding_model: o200k_base

### 存储设置 ###

input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

### 向量存储设置 ###

vector_store:
  type: lancedb
  db_uri: output/lancedb

### 工作流设置 ###

embed_text:
  embedding_model_id: default_embedding_model
  batch_size: 16

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [material, process, structure, property, technology, equipment, application]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
